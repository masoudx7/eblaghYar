name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        # اضافه کردن legacy-peer-deps برای جلوگیری از خطای تداخل پکیج‌ها در سرور گیت‌هاب
        run: npm install --legacy-peer-deps

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools
            platforms;android-35
            build-tools;35.0.0

      - name: Build Web Assets (Frontend)
        run: npm run build

      - name: Sync Capacitor
        # نکته مهم: دستور add android حذف شد چون پوشه از قبل در ریپازیتوری وجود دارد
        run: npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EblaghYar-Android-Debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
