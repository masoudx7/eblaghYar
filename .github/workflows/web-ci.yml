name: Web CI

on:
  push:
    branches:
      - web
  pull_request:
    branches:
      - web

permissions:
  contents: read

concurrency:
  group: web-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint (TypeScript typecheck)
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build production bundle
        run: npm run build

      - name: Verify no server secrets leaked to client bundle
        run: |
          if grep -rnE "GEMINI_API_KEY|SUPABASE_SERVICE_ROLE_KEY|SUPABASE_ANON_KEY|ZARINPAL_MERCHANT_ID|UPSTASH_REDIS_REST_TOKEN|TURNSTILE_SECRET_KEY|CRON_SECRET|RECONCILE_SECRET|BAZAAR_RSA_PUBLIC_KEY|BAZAAR_DEVELOPER_API_TOKEN|MYKET_RSA_PUBLIC_KEY" src dist; then
            echo "ERROR: Server secret identifier detected in client source or build output!"
            exit 1
          fi
